name: Conformance

# Every README PASS claim in this repository is enforced here:
# both reference verifiers run against the byte-pinned fixture set,
# the fixture generator must reproduce the committed bytes exactly,
# the cross-implementation parity gate must report agreement, the
# JCS byte-agreement gate must pass across Go/Python/TypeScript, and
# the machine-readable conformance profile must match the fixtures.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: verifiers + parity + byte-pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            verifiers/go/go.sum
            scripts/generate-fixtures/go.sum
            jcs-vectors/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python verifier dependencies
        run: python3 -m pip install -r verifiers/python/requirements.txt

      - name: Go verifier over fixtures
        working-directory: verifiers/go
        run: go run . ../../fixtures

      - name: Go verifier unit tests (strict-parse depth guard + foldKey)
        working-directory: verifiers/go
        run: go test ./...

      - name: Python verifier over fixtures
        working-directory: verifiers/python
        run: python3 verify.py ../../fixtures

      - name: Schema validation (fixtures vs vendored spec schema)
        run: |
          python3 -m pip install "jsonschema>=4.21"
          python3 scripts/schema_validation.py

      - name: Vendored schema drift gate (pinned atx-spec ref)
        uses: actions/checkout@v4
        with:
          repository: opena2a-standards/atx-spec
          ref: 7551902e7dc4d86fbecf936a43317ba032817265
          path: .spec-src

      - name: Vendored schema drift gate (compare)
        run: |
          diff .spec-src/schemas/atx-credential-v1.1.schema.json \
               schemas/vendor/atx-spec/atx-credential-v1.1.schema.json
          rm -rf .spec-src

      # Binding Decision 10. Ordered BEFORE the byte-pin so a name that should
      # never have been written reports as a content failure, not as a confusing
      # `git diff`. The self-test runs first: a check that has never fired on the
      # text this repository actually published is not a check, so it proves
      # itself red on every denied identifier before it is trusted to say green.
      - name: Implementation-status check proves itself non-vacuous
        run: python3 scripts/check_no_implementation_status.py --self-test

      - name: No other codebase is named in the generated artifacts
        run: python3 scripts/check_no_implementation_status.py

      - name: Fixture byte-pin (generator determinism)
        working-directory: scripts/generate-fixtures
        run: |
          go run .
          cd ../..
          git diff --exit-code -- fixtures MANIFEST.sha256

      - name: MANIFEST.sha256 integrity
        run: |
          rc=0
          while read -r sha file; do
            [ -z "$sha" ] && continue
            got=$(sha256sum "$file" | awk '{print $1}')
            if [ "$got" != "$sha" ]; then
              echo "MANIFEST mismatch: $file"; rc=1
            fi
          done < MANIFEST.sha256
          exit $rc

      - name: JCS byte-agreement gate (Go / Python / TypeScript)
        run: ./jcs-vectors/run-agreement.sh

      - name: Cross-implementation parity gate
        run: python3 scripts/parity/parity.py --json parity-report.json

      - name: Conformance profile is current
        run: python3 scripts/conformance_profile.py --check

      - name: README counts match the fixture set
        run: python3 scripts/check_readme_counts.py

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-report.json
          if-no-files-found: ignore

  sign-manifest:
    name: cosign MANIFEST (keyless, main only)
    runs-on: ubuntu-latest
    needs: conformance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@v3

      - name: Keyless sign MANIFEST.sha256 (Rekor is the durable record)
        run: cosign sign-blob --yes --bundle MANIFEST.sha256.cosign.bundle MANIFEST.sha256

      - name: Self-verify the signature just produced
        run: |
          cosign verify-blob \
            --bundle MANIFEST.sha256.cosign.bundle \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/conformance.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            MANIFEST.sha256

      - name: Upload signature bundle
        uses: actions/upload-artifact@v4
        with:
          name: manifest-cosign-bundle
          path: MANIFEST.sha256.cosign.bundle
